name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  compile:
    name: Compile Contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Compact
        run: |
          # Install Midnight Compact compiler
          curl -L https://github.com/midnightntwrk/compact/releases/download/v0.23.0/compact-linux-x64 -o compact
          chmod +x compact
          sudo mv compact /usr/local/bin/
      - name: Compile BlackBox AI Contract
        run: npm run compile
      - name: Verify Compilation Output
        run: |
          test -d contracts/managed/blackbox-ai/contract
          test -d contracts/managed/blackbox-ai/keys
          test -d contracts/managed/blackbox-ai/zkir
          echo "Compilation artifacts verified"

  typecheck:
    name: TypeScript Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npm run build
        working-directory: ./frontend
      - run: npx tsc --noEmit

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npm run compile
      - run: npm test

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    needs: compile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npm run compile
      - run: npm run frontend:build

  # Note: Full e2e tests require a running Midnight network (devnet or testnet).
  # These are run manually or on a scheduled basis.
  # e2e:
  #   name: E2E Tests
  #   runs-on: ubuntu-latest
  #   needs: [compile, frontend-build]
  #   if: github.event_name == 'schedule' || github.event.inputs.run_e2e == 'true'
  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: actions/setup-node@v4
  #       with:
  #         node-version: ${{ env.NODE_VERSION }}
  #         cache: 'npm'
  #     - run: npm ci
  #     - name: Start Devnet
  #       run: docker compose up -d --wait
  #     - run: npm run setup
  #     - run: npm run test:e2e

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true